<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eLabora - Pendaftaran</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/assets/js/scripts.js"></script>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/pendaftaran.css">
</head>
<body>
    <div id="header"></div>
    <div class="layout">
      <div id="sidebar"></div>
      <main class="content">
        <header class="header-pendaftaran">
            <div class="logo-section">
                <img src="/assets/img/Logo.png" alt="Logo eLabora" class="logo-img">
                <div class="title-section">
                    <h1>Pendaftaran Pemeriksaan Laboratorium</h1>
                    <p>Sistem Pendaftaran Tes Lab Online</p>
                </div>
            </div>
            <nav class="tabs">
                <button id="btnPendaftaran">Pendaftaran Baru</button>
                <button id="btnAntrian">Antrian</button>
            </nav>
        </header>
        <div class="container-pendaftaran">
            <section class="form-card">
                <h2>Form Pendaftaran Pemeriksaan Lab</h2>
                <p>Isi formulir di bawah ini untuk mendaftar pemeriksaan laboratorium</p>

                <form class="lab-form">
                    <h3>Data Pasien</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nama Lengkap *</label>
                            <input type="text" placeholder="Masukkan nama lengkap" required>
                        </div>
                        <div class="form-group">
                            <label>NIK / No. Identitas *</label>
                            <input type="text" placeholder="Masukkan NIK" required>
                        </div>
                        <div class="form-group">
                            <label>Tanggal Lahir *</label>
                            <input type="date" required>
                        </div>
                        <div class="form-group">
                            <label>Jenis Kelamin *</label>
                            <select required>
                                <option value="">Pilih jenis kelamin</option>
                                <option>Laki-laki</option>
                                <option>Perempuan</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>No. Telepon *</label>
                            <input type="tel" placeholder="08xxxxxxxxxx" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="email@example.com">
                        </div>
                        <div class="form-group full">
                            <label>Alamat</label>
                            <textarea placeholder="Masukkan alamat lengkap"></textarea>
                        </div>
                    </div>

                    <h3>Jadwal Pemeriksaan</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Tanggal Pemeriksaan *</label>
                            <input type="date" required>
                        </div>
                        <div class="form-group">
                            <label>Waktu Pemeriksaan *</label>
                            <select required>
                                <option value="">Pilih waktu</option>
                                <option>Pagi (08.00 - 11.00)</option>
                                <option>Siang (13.00 - 15.00)</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Daftar Sekarang</button>
                </form>
            </section>
        </div>
      </main>
    </div>
    <script>
    </script>
</body>
</html>
